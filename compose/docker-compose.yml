  # kb-mcp:
  #   build:
  #     context: ..
  #     dockerfile: compose/Dockerfile
  #   command: ["kb", "serve", "--transport", "streamable-http"]
  #   environment:
  #     DATABASE_URL: postgresql://kb_read:${KB_READ_PASSWORD:-kb}@db:5432/kb
  #     DATABASE_URL_INDEX: postgresql://kb_index:${KB_INDEX_PASSWORD:-kb}@db:5432/kb
  #     OLLAMA_BASE_URL: http://ollama:11434
  #     KB_BIND: 0.0.0.0:8765
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     ollama:
  #       condition: service_healthy
  #   # binds 0.0.0.0:8765 inside the compose network only -- not published to the host.
  #
  # kb-static:
  #   image: caddy:2
  #   command: ["caddy", "file-server", "--root", "/kb", "--listen", ":8080", "--browse=false"]
  #   volumes:
  #     - ${KB_PATH:-../../dgx-knowledge}/kb:/kb:ro
  #
  # caddy:
  #   image: caddy:2
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #   ports:
  #     - "443:443"
