# Stage 2 compose (brief §7.2, §9 S4):
#
#   - `db` is real: pgvector/pgvector:pg16, a volume, a pg_isready healthcheck, and an init
#     script that creates database `kb` and the two roles (`kb_index` owner, `kb_read`
#     SELECT-only).
#   - `ollama` serves the embedding model; a `GET /api/tags` healthcheck (added this
#     milestone) lets `kb-mcp` wait for it to actually be up before starting, not merely
#     for the container to exist. Pulling a model (`docker compose exec ollama ollama pull
#     nomic-embed-text`) is a separate, manual step -- compose never does it.
#   - `kb-mcp` is built from `compose/Dockerfile` and runs `kb serve --transport http`,
#     binding `0.0.0.0:8765` inside the compose network only -- no `ports:` entry, so it is
#     unreachable except through `caddy`. Also used as a one-off: `docker compose run --rm
#     kb-mcp kb index` (and `kb index --init`).
#   - `kb-static` is a plain `caddy file-server` over a read-only bind mount of
#     `${KB_PATH}/kb`, also with no published port -- reachable only via `caddy`'s `/kb/*`
#     route, which itself requires the same bearer token (see `compose/Caddyfile`).
#   - `caddy` is the only service that publishes a port to the world: 443, TLS-terminated,
#     reverse-proxying `/mcp*`+`/health` to `kb-mcp` and `/kb/*` (token-gated) to
#     `kb-static`. `compose/caddy-entrypoint.sh` fills in the Caddyfile's token matcher and
#     TLS directive from `$KB_TOKENS`/`$TLS_CERT`/`$TLS_KEY` before starting Caddy.
#   - the `dev` profile additionally publishes `db` and `ollama` to `127.0.0.1` for a host
#     venv (`uv run kb ...` from the repo directly, without any of the above). `db` and
#     `ollama` also belong to the `prod` profile (see the note on their `profiles:` below)
#     since `kb-mcp` needs both regardless of whether a developer's host venv is in the
#     picture; only their host port publication is a `dev`-only concern, not their
#     existence.
#
# Only `caddy` publishes a port to the LAN (hard rule 7). `db`/`ollama`'s `dev`-profile
# ports are loopback-bound (`127.0.0.1:`), pre-existing from S0, and unrelated to whether
# `prod` is active.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KB_INDEX_PASSWORD: ${KB_INDEX_PASSWORD:-kb}
      KB_READ_PASSWORD: ${KB_READ_PASSWORD:-kb}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kb"]
      interval: 5s
      timeout: 5s
      retries: 10
    # In both profiles: `prod`'s kb-mcp needs a running db regardless of the dev host
    # venv. Only the `dev` profile publishes its port to localhost.
    profiles: ["dev", "prod"]
    ports:
      - "127.0.0.1:5432:5432"

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # `ollama/ollama`'s image ships neither curl nor wget (verified: `command -v` finds
      # neither), so a literal `GET /api/tags` isn't expressible as a CMD-SHELL probe.
      # `ollama list` calls that exact endpoint internally and exits non-zero if the
      # server isn't answering, so it is the same check by the tool that ships in the
      # image.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    profiles: ["dev", "prod"]
    ports:
      - "127.0.0.1:11434:11434"

  kb-mcp:
    build:
      context: ..
      dockerfile: compose/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kb_read:${KB_READ_PASSWORD:-kb}@db:5432/kb
      DATABASE_URL_INDEX: postgresql://kb_index:${KB_INDEX_PASSWORD:-kb}@db:5432/kb
      OLLAMA_BASE_URL: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      EMBED_DIM: ${EMBED_DIM:-768}
      # No `:?` required-variable syntax anywhere in this file: Compose interpolates the
      # whole file even when starting only `db`, so a required prod-only value would break
      # the dev path. `kb serve` itself refuses to start without KB_URL_BASE, loudly.
      KB_URL_BASE: ${KB_URL_BASE:-}
      KB_BIND: 0.0.0.0:8765
      KB_PUBLIC_HOST: ${KB_PUBLIC_HOST:-localhost}
      KB_TOKENS: ${KB_TOKENS:-}
      # The host's KB_PATH is bind-mounted at a fixed container path below, and KB_PATH
      # is overridden to match -- `retrieval/config.py` resolves `${KB_PATH}/kb` the same
      # way whether it is running in the host venv or in this container.
      KB_PATH: /kb-repo
    volumes:
      # KB_PATH must be ABSOLUTE in .env for the compose stack: Compose resolves a relative
      # bind-mount source against compose/, not the repo root. `make compose-up` and
      # `make compose-index` check this before invoking Compose. The /dev/null default only
      # exists so the dev path (db alone, no .env) still parses.
      - ${KB_PATH:-/dev/null}:/kb-repo:ro
    command: ["kb", "serve", "--transport", "http"]
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    profiles: ["prod"]
    # No `ports:` entry -- binds 0.0.0.0:8765 inside the compose network only, reachable
    # solely via `caddy`.

  kb-static:
    image: caddy:2
    restart: unless-stopped
    command: ["caddy", "file-server", "--root", "/kb", "--listen", ":8080", "--browse=false"]
    volumes:
      - ${KB_PATH:-/dev/null}/kb:/kb:ro   # absolute KB_PATH; see kb-mcp above
    profiles: ["prod"]
    # No `ports:` entry -- reachable solely via `caddy`'s /kb/* route, which itself
    # requires the same bearer token (compose/Caddyfile).

  caddy:
    image: caddy:2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/caddy/caddy-entrypoint.sh"]
    environment:
      KB_TOKENS: ${KB_TOKENS:-}
      KB_PUBLIC_HOST: ${KB_PUBLIC_HOST:-localhost}
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-entrypoint.sh:/etc/caddy/caddy-entrypoint.sh:ro
      - caddy-data:/data
      - ${TLS_CERT:-/dev/null}:/etc/caddy/tls/cert.pem:ro
      - ${TLS_KEY:-/dev/null}:/etc/caddy/tls/key.pem:ro
    ports:
      - "443:443"
    depends_on:
      - kb-mcp
      - kb-static
    profiles: ["prod"]

volumes:
  db-data:
  ollama-data:
  caddy-data:
