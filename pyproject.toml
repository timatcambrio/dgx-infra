[project]
name = "dgx-pipeline"
version = "0.1.0"
description = "Stage 1: institutional documents -> markdown, with a text-layer coverage report."
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Dependency policy (see README "License policy"): permissive licences only for anything
# IMPORTED. Copyleft tools are allowed only when invoked as a subprocess (LibreOffice).
# PyMuPDF / pymupdf4llm (AGPL) are import-only and therefore permanently banned.
dependencies = [
    # MIT. `docling-slim` with explicit extras, NOT the `docling` meta-package.
    #
    # `docling` is defined as `docling-slim[standard]`, and that bundle installs every OCR
    # backend whether or not you use one -- including `rapidocr`, whose wheel BUNDLES ~30MB
    # of Baidu PaddleOCR weights (PP-OCRv6_det, PP-OCRv6_rec, ch_ppocr_mobile) as files on
    # disk. Those are exactly the Chinese-trained weights the provenance rule forbids, and
    # because they ship inside a wheel rather than a model cache, a cache-scanning gate never
    # sees them. Naming extras keeps them off the machine in the first place.
    #
    # The PDF extras live in [project.optional-dependencies] below, not here.
    "docling-slim[format-docx]>=2.126.0,<3",
    "pypdfium2>=5.0.3,<6",          # BSD   - page text extraction for triage
    "pdfplumber>=0.11.7,<0.12",     # MIT   - table geometry rescue
    "pyyaml>=6.0.2,<7",             # MIT   - corpus.yaml
    "python-frontmatter>=1.1.0,<2", # MIT   - kb/ frontmatter
    "typer>=0.19.2,<0.20",          # MIT   - CLI
]

[project.optional-dependencies]
# The PDF conversion path, deliberately NOT installed by default.
#
# Everything heavy in this project is here: `format-pdf-docling` pulls torch. Behind an
# extra, the DOCX + CSV + triage install stays small and carries no ML runtime at all --
# which matters for an on-prem federal deployment, where every megabyte is something the
# client fetches and audits.
#
# `markitdown` was listed here as a per-file fallback and was never called. It pulled magika,
# which pulls onnxruntime, so an unused dependency was dragging a second ML runtime into the
# one extra that exists to keep ML runtimes out. Removed; add it back with a call site.
#
# Install with:  uv sync --extra pdf
pdf = [
    "docling-slim[format-pdf-docling]>=2.126.0,<3",  # MIT - layout + TableFormer
    # torch 2.2.2 is the last release with a macOS x86_64 wheel (README "Platform
    # constraint") and was built against NumPy 1.x; with NumPy 2 its array bridge fails to
    # initialise. transformers 5.x separately disables its torch backend below torch 2.4,
    # which would leave Docling with no usable models. Both scoped to the dev platform, and
    # both only relevant once torch is present -- which is why they live in this extra.
    "numpy<2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers<5 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

# Stage 2: index kb/ into Postgres and serve it over MCP (stage2-retrieval-brief.md §2.5).
# Deliberately NOT installed by default -- Stage 2 must not fatten Stage 1's install. A bare
# `uv sync` installs only the conversion CLI; `retrieval/` and its tests need this extra.
#
# Install with:  uv sync --extra serve
serve = [
    "mcp>=1.28,<2",        # MIT   - the 1.x line, DECIDED (brief §2.5); 2.x is a later task
    "asyncpg>=0.30,<1",    # Apache-2.0 - Postgres driver
    "pgvector>=0.3,<1",    # MIT   - asyncpg vector codec
    "httpx>=0.27,<1",      # BSD   - ollama client
]

[project.scripts]
pipeline = "pipeline.cli:app"
kb = "retrieval.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",       # MIT
    "reportlab>=4.4.4,<5",    # BSD - fixture generation only
    "python-docx>=1.2.0,<2",  # MIT - fixture generation only
]

[tool.uv]
# Both of these platforms must have installable wheels for every locked dependency:
# linux-x86_64 is the DGX/client target, darwin-x86_64 is the current dev machine.
# This matters because torch ships no macOS x86_64 wheel after 2.2.2, so without this
# constraint `uv lock` happily produces a lock that cannot be installed on the dev Mac.
# A resolution failure here is the intended loud signal that a dependency has dropped a
# platform we still support -- see README "Platform constraint".
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
