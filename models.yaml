# Model allowlist. Enforced by `scripts/model_gate.py` under `make check`.
#
# Two independent tests, both of which a model must pass:
#   1. Weights under a permissive licence. An undeclared licence is not permissive --
#      absent a grant, all rights are reserved.
#   2. Non-Chinese base-weight provenance, judged on the BASE WEIGHTS, not on the releasing
#      organisation. A US lab fine-tuning a Chinese base does not clear the rule; conversely
#      a Chinese-originated *architecture* trained from scratch on other weights does clear
#      it, which is precisely the distinction that has to be evidenced rather than assumed.
#
# `allowed_models` is deliberately EMPTY in this phase. Stage 1 is model-free for text:
# OCR is off, no conversion is run, and nothing should ever be fetched. An empty allowlist
# plus the gate's cache scan therefore asserts something true and useful right now -- that
# no model has been downloaded -- and it will fail the moment one appears.
#
# `pending_review` records models Docling WOULD fetch once M2 conversion runs, together with
# what is actually known about each. These are not approved. The gate reports them on every
# run and fails if one is found in a cache, so M2 cannot quietly begin by downloading a model
# whose provenance is still an open question.

version: 1

allowed_models: []

pending_review:
  - model: "docling-project/docling-layout-heron"
    license: "apache-2.0"
    developer: "IBM Research (Deep Search team) / docling-project"
    base_model: "ResNet50_vd_ssld_v2 (PaddleClas), via RT-DETRv2-r50vd"
    base_developer: "Baidu (PaddleClas) -- ImageNet classification backbone only"
    purpose: "Default layout analysis model for Docling's PDF pipeline."
    verified: |
      2026-09-11. CLOSED, and it went the other way from the 2026-09-10 assessment below.
      Chain, all from primary sources:
        * arXiv:2509.11720 Object Detectors section: "The backbones (ResNet-50, ResNet-101,
          HGNet-V2) have been initialized with pre-trained weights."
        * Same section: "We trained the models with their native code implementations."
        * Native for RT-DETRv2 is lyuwenyu/RT-DETR (the Baidu authors' repo). Its
          configs/rtdetrv2/include/rtdetrv2_r50vd.yml sets `PResNet: {depth: 50, variant: d,
          pretrained: True}`.
        * `pretrained: True` resolves in src/nn/backbone/presnet.py to
          `ResNet50_vd_ssld_v2_pretrained_from_paddle.pth` -- a Baidu PaddleClas SSLD
          checkpoint. (101 -> `ResNet101_vd_ssld_pretrained_from_paddle.pth`.)
        * Corroboration: the `vd` variant is a PaddleClas lineage. torchvision ships no
          ResNet-vd, so there is no non-Paddle source for a backbone of that exact shape.
          The 2026-09-10 "conventionally ImageNet (torchvision/MSRA)" assumption was wrong:
          it is ImageNet-trained, but by Baidu, and it is the vd variant specifically.
      SUPERSEDES the 2026-09-10 assessment ("probably clears"). It does not clear on a
      strict reading.
    blocker: |
      NOT a research question any more -- a policy call for [USER], recorded in README open
      question 2.
      FOR: what was inherited is an ImageNet-1k *classification backbone* -- convolutional
      features, no language, no text corpus -- which is a different object from the
      Qwen/olmOCR/DeepSeek-OCR cases the rule was written to catch, where the inherited
      weights carry the model's behaviour. The detector itself was trained by IBM for 72
      epochs on their own 150k-document corpus.
      AGAINST: the rule judges base weights, not the releasing organisation, and is
      deliberately a bright line. "It is only the backbone" is exactly the sort of argument
      that erodes one.
      PRECEDENT: Paddle-lineage ImageNet backbones are pervasive across vision detectors. A
      strict reading rules out most modern layout and table-structure models permanently and
      makes the geometry engine the only long-term option rather than the preferred one.
      RESIDUAL UNCERTAINTY: the paper never names the checkpoint. The chain rests on their
      "native code implementations" statement, where that checkpoint is the repo default.
      Strong inference, not a maintainer's confirmation. A question to the Docling
      maintainers would close it; drafted, not yet filed.
      DO NOT "upgrade" to the egret variants: D-FINE based, HGNet-V2 backbones whose D-FINE
      weights are `PPHGNetV2_B*_stage1.pth` ("PP" = PaddlePaddle), so they are strictly
      worse on provenance. The gate rejects both markers by name.

  - model: "docling-project/docling-models"
    license: "apache-2.0"
    developer: "IBM Research (Deep Search team) / docling-project"
    base_model: "TableFormer (trained from scratch)"
    base_developer: "IBM Research"
    purpose: >
      TableFormer table-structure weights. This is what Docling's DEFAULT PdfPipelineOptions
      actually fetches -- `table_structure_options` defaults to `TableStructureOptions`
      (kind `docling_tableformer`), which resolves to the v1 TableStructureModel and this
      repo. NOT TableFormerV2.
    verified: |
      2026-09-10. Licence `apache-2.0` + `cdla-permissive-2.0` confirmed via the HuggingFace
      API. Default selection confirmed by constructing PdfPipelineOptions() and reading
      table_structure_options.kind. TableFormer is IBM Research's own architecture and
      weights (Nassar et al., IBM Research), not a fine-tune of a third-party base.
    blocker: |
      None known on licence or provenance. Left in pending_review only because this phase
      fetches no model at all; promote it to allowed_models when M2 starts.

  - model: "docling-project/TableFormerV2"
    license: "UNDECLARED"
    developer: "docling-project"
    base_model: "UNCONFIRMED"
    base_developer: "UNCONFIRMED"
    purpose: >
      Newer table-structure model, reachable only by explicitly selecting
      TableStructureV2Options (kind `docling_tableformer_v2`). NOT the default. Listed here
      so that opting into it trips the gate.
    verified: "2026-09-09 against the HuggingFace model card and API."
    blocker: |
      The repository declares NO licence -- no `license` tag and no `cardData.license`. Its
      only tags are `safetensors`, `TableFormerV2`, `region:us`, and the model card carries
      no text. Absent an explicit grant the weights are all-rights-reserved, which fails
      test 1 outright regardless of provenance.
      DO NOT opt into this model. The default (docling-models, above) is properly licensed
      and needs no action.

  - model: "docling-project/docling-layout-heron-onnx"
    license: "UNCONFIRMED"
    developer: "IBM Research (Deep Search team) / docling-project"
    base_model: "docling-project/docling-layout-heron"
    base_developer: "UNCONFIRMED"
    purpose: >
      ONNX export of the default layout model. Fetched instead of the safetensors weights
      when the ONNXRuntime object-detection engine is selected, so it inherits the heron
      question above and must be cleared alongside it.
    verified: "2026-09-09 -- referenced as an engine override in docling's layout model spec."

  - model: "ibm-granite/granite-docling-258M"
    license: "apache-2.0"
    developer: "IBM Research"
    base_model: "Idefics3 architecture; siglip2-base-patch16-512 vision encoder + Granite 165M LLM"
    base_developer: "Google (SigLIP2 encoder) / IBM Research (Granite LLM)"
    purpose: >
      Docling's VLM pipeline, an alternative to the layout-model pipeline. Listed because it
      is the only capable document VLM found so far that clears BOTH tests, and it would be
      the natural escalation path if heron is ruled out.
    verified: |
      2026-09-11 from the HuggingFace model card. Frontmatter `license: apache-2.0`.
      Architecture stated as Idefics3 with two substitutions: the vision encoder replaced by
      `siglip2-base-patch16-512` (Google) and the language model by Granite 165M (IBM).
      Trained by IBM Research on SynthCodeNet, SynthFormulaNet, SynthChartNet and
      DoclingMatix, on IBM's Blue Vela cluster. No Chinese base weights in either inherited
      component.
    blocker: |
      None known on licence or provenance -- this is the cleanest candidate in the landscape
      survey (docs/parser-landscape.md). NOT promoted to allowed_models because three
      practical questions are unanswered, none of which are compliance questions:
        1. Inference cost on the target hardware (sm_70 DGX), unmeasured.
        2. Whether a 258M VLM actually beats the geometry engine on THIS corpus. The 0%
           needs_ocr result means the text layer is intact, so the VLM has to win on layout
           alone to be worth its runtime.
        3. Whether it forces a runtime model download the client-runs-the-pipeline
           distribution shape cannot absorb.
      Promote only after those are measured, and only if a VLM path is actually chosen.
